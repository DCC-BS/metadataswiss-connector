[project]
name = "metadataswiss-connector"
version = "0.1.0"
description = "metadataswiss-connector"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster>=1.11",
    "dagster-dlt>=0.29",
    "dagster-postgres>=0.27",
    "dagster-webserver>=1.11",
    "dlt[duckdb]>=1.24.0",
    "i14y-client",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
i14y-client = { path = "packages/i14y-client", editable = true }

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.56.0",
    "pytest>=8.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.dagster]
module_name = "metadataswiss_connector.dagster_defs"
