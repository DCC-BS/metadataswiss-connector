[project]
name = "metadataswiss-connector"
version = "0.1.0"
description = "Dataspot to I14Y metadata connector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dlt[duckdb]>=1.24.0",
    "i14y-client",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
i14y-client = { path = "packages/i14y-client", editable = true }

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.56.0",
]

[project.scripts]
metadataswiss-connector = "metadataswiss_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
