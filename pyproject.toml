[project]
name = "metadataswiss-connector"
version = "0.1.0"
description = "Dataspot to I14Y metadata connector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.12.21",
    "dagster-dlt>=0.27.0",
    "dagster-webserver>=1.12.21",
    "dlt[duckdb]>=1.24.0",
    "i14y-client",
]

[tool.uv.sources]
i14y-client = { path = "packages/i14y-client", editable = true }

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.dagster]
module_name = "metadataswiss_connector.definitions"
code_location_name = "metadataswiss_connector"
